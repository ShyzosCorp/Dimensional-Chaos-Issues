name: Mod — Feature Request
description: Suggest a feature or change for the Dimensional Chaos mod.
title: "[Feature] "
labels: [enhancement, needs-triage, "project:mod"]
body:
  - type: markdown
    attributes:
      value: |
        What would you like to see in the Dimensional Chaos mod? Search existing requests first and keep each request to one idea.
        For pack content or settings, use Modpack — Feature Request.
        Everything here is public, so leave out personal information and credentials.
  - type: input
    id: summary
    attributes:
      label: Feature summary
      description: What's the idea? A sentence is enough.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Problem or motivation
      description: What problem would this solve, or what would it make better?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Add examples or screenshots if they help. Remove private information first.
