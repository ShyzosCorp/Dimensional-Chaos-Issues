name: Modpack bug
description: A crash or anything else going wrong in the OneBlock modpack.
title: "[Modpack Bug] "
labels: [bug, needs-triage, "project:modpack"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! Crashes, mod conflicts, recipes, quests, progression, server pack: it all goes here.
        One problem per report makes it much easier for us to track.

        Everything here is public, so remove anything personal from logs and screenshots (IP addresses, your username in file paths, tokens). Please don't upload worlds or account files.
  - type: input
    id: pack-version
    attributes:
      label: Modpack version
      description: The modpack version shown in CurseForge (for example 1.1.2).
    validations:
      required: true
  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      placeholder: "1.21.1"
    validations:
      required: true
  - type: input
    id: neoforge-version
    attributes:
      label: NeoForge version (if known)
      description: Leave it blank if you don't know.
      placeholder: "21.1.x"
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Singleplayer
        - LAN
        - Dedicated Server
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      description: On a server, add the server's OS too if you know it.
      placeholder: Windows 11 / Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: installation-method
    attributes:
      label: Installation method
      options:
        - CurseForge App
        - Manual
        - Server installation
        - Other (describe in reproduction steps)
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: What's it about?
      options:
        - Crash or startup failure
        - Performance / FPS / memory
        - Mod compatibility
        - OneBlock progression
        - Quests or rewards
        - Dimensional gateways / portals
        - Island / multiplayer / teams
        - Interface or visual issue
        - Other
    validations:
      required: true
  - type: dropdown
    id: modified-pack
    attributes:
      label: Did you change the modpack?
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: pack-changes
    attributes:
      label: What did you change? (if you did)
      description: Mods you added, removed or updated, and settings you changed.
  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: What happened instead?
      description: Copy any error message you saw.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we make it happen?
      description: The steps you took. If it only happens sometimes, tell us when you noticed it.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: allocated-ram
    attributes:
      label: RAM (for lag, FPS or memory problems)
      description: How many GB you gave the game in CurseForge. Skip it for other bugs.
  - type: textarea
    id: diagnostics
    attributes:
      label: Logs or crash report
      description: Drag in logs/latest.log, or the crash report from crash-reports/ if the game crashed. For server problems, the server log helps too.
  - type: textarea
    id: media
    attributes:
      label: Screenshots or video (optional)
  - type: checkboxes
    id: existing-issues
    attributes:
      label: Already reported?
      options:
        - label: I checked the open and closed issues and didn't find this one.
          required: true
