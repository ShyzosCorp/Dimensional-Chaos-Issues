name: Modpack idea
description: An idea or change for the OneBlock modpack.
title: "[Modpack Feature] "
labels: [enhancement, needs-triage, "project:modpack"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea? We'd love to hear it. One idea per request, please, and have a quick look at the existing ones first.
        Ideas about the Dimensional Chaos mod itself go in the mod idea form.
  - type: input
    id: summary
    attributes:
      label: Your idea in one sentence
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why would it help?
      description: What's missing or annoying right now?
    validations:
      required: true
  - type: dropdown
    id: gameplay-area
    attributes:
      label: What part of the game?
      options:
        - Progression / balancing
        - Quests
        - Technology / automation
        - Magic
        - Exploration / dimensions
        - Multiplayer
        - Performance / accessibility
        - Quality of life
        - Other
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How do you picture it?
      description: How would it work in game?
    validations:
      required: true
  - type: textarea
    id: player-benefit
    attributes:
      label: Who would enjoy it?
      description: Solo players, teams, tech players, explorers...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways to do it (optional)
  - type: textarea
    id: context
    attributes:
      label: Anything else? (optional)
      description: Examples, screenshots, other packs that do it well...
