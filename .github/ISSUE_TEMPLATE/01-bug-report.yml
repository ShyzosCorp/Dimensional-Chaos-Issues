name: Mod bug
description: Something broken in the Dimensional Chaos mod? Tell us here.
title: "[Bug] "
labels: [bug, needs-triage, "project:mod"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! One problem per report makes it much easier for us to track.
        Playing the OneBlock modpack and not sure the mod is the culprit? Use the modpack bug form instead.

        Everything here is public, so remove anything personal from logs and screenshots (IP addresses, your username in file paths, tokens). Please don't upload worlds or account files.
  - type: input
    id: mod-version
    attributes:
      label: Dimensional Chaos mod version
      description: You'll find it in the Mods screen (it's not the modpack version).
    validations:
      required: true
  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      placeholder: "1.21.1"
    validations:
      required: true
  - type: input
    id: neoforge-version
    attributes:
      label: NeoForge version
      description: Shown in your launcher or server console.
      placeholder: "21.1.x"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Singleplayer
        - LAN
        - Dedicated Server
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      description: On a server, add the server's OS too if you know it.
      placeholder: Windows 11 / Ubuntu 24.04
  - type: dropdown
    id: companion-modpack
    attributes:
      label: Are you playing the official OneBlock modpack?
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true
  - type: input
    id: modpack-version
    attributes:
      label: Modpack version (if you are)
      description: Plus any mods you added or removed, if you changed the pack.
  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: What happened instead?
      description: Copy any error message you saw.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we make it happen?
      description: The steps you took. If it only happens sometimes, tell us when you noticed it.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: Drag in logs/latest.log, or the crash report from crash-reports/ if the game crashed. For server problems, the server log helps too.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
  - type: checkboxes
    id: existing-issues
    attributes:
      label: Already reported?
      options:
        - label: I checked the open and closed issues and didn't find this one.
          required: true
