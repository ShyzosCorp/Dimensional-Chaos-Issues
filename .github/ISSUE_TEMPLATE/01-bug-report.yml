name: Mod — Bug Report
description: Something going wrong with the Dimensional Chaos mod? Report it here.
title: "[Bug] "
labels: [bug, needs-triage, "project:mod"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what's going wrong with the Dimensional Chaos mod, including compatibility bugs.
        For pack installation or settings problems, use Modpack — Bug Report.
        Search existing issues first and keep each report to one problem.
        Reports and attachments are public. Check logs, crash reports and screenshots before posting:
        remove tokens, passwords, session data, personal paths, IP addresses and other private information.
        Don't upload worlds, player data or launcher account files.
  - type: input
    id: mod-version
    attributes:
      label: Dimensional Chaos mod version
      description: Find this in the Mods screen. Use the mod version, not the pack version.
    validations:
      required: true
  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      placeholder: "1.21.1"
    validations:
      required: true
  - type: input
    id: neoforge-version
    attributes:
      label: NeoForge version
      description: Copy the full version from your launcher or server.
      placeholder: "21.1.x"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Singleplayer
        - LAN
        - Dedicated Server
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      description: Just the OS name and version. On a dedicated server, include both client and server OS if you know them.
      placeholder: Windows 11 / Ubuntu 24.04
  - type: dropdown
    id: companion-modpack
    attributes:
      label: Are you using the official companion modpack?
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true
  - type: input
    id: modpack-version
    attributes:
      label: Companion modpack version (if applicable)
      description: If yes, add the pack version and any changes you've made to its mod list.
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What happened instead? Include any error message you saw.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the steps, settings and other mod versions needed to reproduce this. If it only happens sometimes, tell us when.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs and crash reports
      description: Attach latest.log or a crash report, or paste the relevant part. Remove private information first. For server problems, client and server logs both help if you have them. Leave blank if no logs are available.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Add screenshots if they help. Remove private information first.
  - type: checkboxes
    id: existing-issues
    attributes:
      label: Existing issues
      options:
        - label: I searched existing open and closed issues for the same problem.
          required: true
