name: Mod idea
description: An idea or change for the Dimensional Chaos mod.
title: "[Feature] "
labels: [enhancement, needs-triage, "project:mod"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea? We'd love to hear it. One idea per request, please, and have a quick look at the existing ones first.
        Ideas about the pack's content or settings go in the modpack idea form.
  - type: input
    id: summary
    attributes:
      label: Your idea in one sentence
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why would it help?
      description: What's missing or annoying right now?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How do you picture it?
      description: How would it work in game?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways to do it (optional)
  - type: textarea
    id: context
    attributes:
      label: Anything else? (optional)
      description: Examples, screenshots, other packs that do it well...
