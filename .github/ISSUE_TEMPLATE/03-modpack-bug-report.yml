name: Modpack — Bug Report
description: Report a crash or other problem with the OneBlock modpack.
title: "[Modpack Bug] "
labels: [bug, needs-triage, "project:modpack"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for OneBlock pack crashes, mod conflicts, settings, recipes, progression or server pack problems.
        If you've traced the bug to the custom mod itself, use Mod — Bug Report. If you're unsure, describe your setup here.
        Search existing issues first and keep each report to one problem.
        Reports and attachments are public. Check logs, crash reports, screenshots and videos before posting.
        Remove credentials, session data, personal paths, IP addresses and other private information.
        Don't upload worlds, player data or launcher account files.
  - type: input
    id: pack-version
    attributes:
      label: Modpack version
      description: Copy the full OneBlock pack version from your launcher, not the custom mod version.
    validations:
      required: true
  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      placeholder: "1.21.1"
    validations:
      required: true
  - type: input
    id: neoforge-version
    attributes:
      label: NeoForge version (if known)
      description: Copy the full loader version from your launcher or server, or leave blank if you don't know it.
      placeholder: "21.1.x"
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Singleplayer
        - LAN
        - Dedicated Server
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      description: Just the OS name and version. On a dedicated server, include both client and server OS if you know them.
      placeholder: Windows 11 / Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: installation-method
    attributes:
      label: Installation method
      options:
        - CurseForge App
        - Manual
        - Server installation
        - Other (describe in reproduction steps)
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Bug category
      options:
        - Crash or startup failure
        - Performance / FPS / memory
        - Mod compatibility
        - OneBlock progression
        - Quests or rewards
        - Dimensional gateways / portals
        - Island / multiplayer / teams
        - Interface or visual issue
        - Other
    validations:
      required: true
  - type: dropdown
    id: modified-pack
    attributes:
      label: Has the official modpack been modified?
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: pack-changes
    attributes:
      label: Changes to the official modpack (if applicable)
      description: List any mods you've added, removed or updated, with versions, and any relevant settings changes. Leave blank if you haven't changed the pack.
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What happened? Include any error message you saw.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the steps and settings needed to reproduce this. If it only happens sometimes, tell us when.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: allocated-ram
    attributes:
      label: Allocated RAM (for memory or performance problems)
      description: How much RAM (in GB) can your launcher use? Include the server's limit if relevant. Leave blank for other kinds of bugs.
  - type: textarea
    id: diagnostics
    attributes:
      label: Logs and crash report (if available)
      description: Attach client or server latest.log files, or paste the relevant parts. Remove private information first. If there was a crash, add its report if you have one; other bugs don't need one.
  - type: textarea
    id: media
    attributes:
      label: Screenshots or videos (optional)
      description: Add screenshots, a video or a public video link if they help. Remove private information first.
  - type: checkboxes
    id: existing-issues
    attributes:
      label: Existing issues
      options:
        - label: I searched existing open and closed issues for the same problem.
          required: true
