name: Modpack — Feature Request
description: Suggest a feature or change for the OneBlock modpack.
title: "[Modpack Feature] "
labels: [enhancement, needs-triage, "project:modpack"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest a change to OneBlock's content, settings or gameplay. Search existing requests first and keep each request to one idea.
        For features of the custom mod itself, use Mod — Feature Request.
        Everything here is public, so leave out private information and credentials.
  - type: input
    id: summary
    attributes:
      label: Feature summary
      description: What's the idea? A sentence is enough.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Problem or limitation
      description: What problem or limitation would this address?
    validations:
      required: true
  - type: dropdown
    id: gameplay-area
    attributes:
      label: Relevant gameplay area
      options:
        - Progression / balancing
        - Quests
        - Technology / automation
        - Magic
        - Exploration / dimensions
        - Multiplayer
        - Performance / accessibility
        - Quality of life
        - Other
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: player-benefit
    attributes:
      label: Expected player benefit
      description: Who would this help, and how?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative suggestions (optional)
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Add examples or media if they help. Remove private information first.
